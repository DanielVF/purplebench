[package]
name = "purplebench"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
csv = "1.4.0"
hex = "0.4.3"
rayon = "1.12.0"
reqwest = { version = "0.13.3", features = ["blocking", "json"] }
revm = "38.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha3 = "0.11.0"
toml = "1.1.2"
